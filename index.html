<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>카카오워크 OCR 스캐너</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Tesseract.js v5 -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    /* D2Coding Monospace Font */
    @font-face {
      font-family: 'D2Coding';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/D2Coding.woff') format('woff');
      font-weight: normal;
      font-style: normal;
    }

    :root {
      --kw-yellow: #FFEB00;
      --kw-yellow-hover: #F5E000;
      --kw-dark: #2C2C2C;
      --kw-darker: #1E1E1E;
      --kw-gray: #F4F5F7;
      --kw-green: #00C73C;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: 'D2Coding', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--kw-gray);
      color: var(--kw-dark);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 스캔 박스 및 마스크 효과 */
    .scan-box {
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.58);
      border: 2.5px solid var(--kw-yellow);
      transition: border-color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
    }

    .scan-box.detected {
      border-color: var(--kw-green);
      transform: scale(1.03);
      box-shadow: 0 0 20px rgba(0, 199, 60, 0.6), 0 0 0 9999px rgba(0, 0, 0, 0.58);
    }

    /* 코너 브라켓 장식 */
    .corner {
      position: absolute;
      width: 14px;
      height: 14px;
      border-color: var(--kw-yellow);
      border-style: solid;
      pointer-events: none;
    }
    .corner-tl { top: -2px; left: -2px; border-width: 4px 0 0 4px; border-top-left-radius: 6px; }
    .corner-tr { top: -2px; right: -2px; border-width: 4px 4px 0 0; border-top-right-radius: 6px; }
    .corner-bl { bottom: -2px; left: -2px; border-width: 0 0 4px 4px; border-bottom-left-radius: 6px; }
    .corner-br { bottom: -2px; right: -2px; border-width: 0 4px 4px 0; border-bottom-right-radius: 6px; }

    /* 레이저 애니메이션 */
    .laser-line {
      position: absolute;
      left: 4%;
      right: 4%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--kw-yellow), #fff, var(--kw-yellow), transparent);
      box-shadow: 0 0 10px var(--kw-yellow);
      animation: laserScan 1.6s infinite ease-in-out;
    }

    .paused .laser-line {
      display: none;
    }

    @keyframes laserScan {
      0%, 100% { top: 12%; opacity: 0.7; }
      50% { top: 88%; opacity: 1; }
    }

    /* 커스텀 스크롤바 */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="select-none">

  <!-- 상단 헤더: 앱 타이틀 & 인식 모드 전환 -->
  <header class="bg-[#FFEB00] text-[#2C2C2C] px-3.5 py-2.5 flex items-center justify-between shadow-sm z-20 shrink-0">
    <div class="flex items-center gap-2">
      <span class="inline-flex items-center justify-center w-7 h-7 rounded-lg bg-[#2C2C2C] text-[#FFEB00] font-bold text-sm">OCR</span>
      <div>
        <h1 class="font-bold text-sm sm:text-base leading-tight">카카오워크 숫자/문자 스캐너</h1>
        <p id="engineStatus" class="text-[11px] text-neutral-700 leading-none mt-0.5">OCR 엔진 준비 중...</p>
      </div>
    </div>

    <!-- 모드 전환 버튼 (숫자 전용 vs 문자+숫자) -->
    <div class="flex items-center bg-[#2C2C2C]/10 p-0.5 rounded-full">
      <button id="modeNumBtn" type="button" class="px-2.5 py-1 rounded-full text-xs font-bold bg-[#2C2C2C] text-[#FFEB00] transition-all">
        123 숫자전용
      </button>
      <button id="modeAllBtn" type="button" class="px-2.5 py-1 rounded-full text-xs font-bold text-[#2C2C2C] hover:bg-black/5 transition-all">
        가A1 문자+숫자
      </button>
    </div>
  </header>

  <!-- 플로팅 토스트 메시지 -->
  <div id="toast" class="fixed top-14 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 transition-all duration-200 transform -translate-y-2">
    <div class="bg-[#2C2C2C]/95 text-[#FFEB00] px-4 py-2 rounded-full shadow-lg border border-[#FFEB00]/30 text-xs sm:text-sm font-bold flex items-center gap-2 whitespace-nowrap">
      <span id="toastIcon">✨</span>
      <span id="toastMsg">알림</span>
    </div>
  </div>

  <!-- 1. 라이브 카메라 & 타겟 스캔 영역 -->
  <section id="cameraContainer" class="relative w-full h-[33dvh] min-h-[195px] max-h-[290px] bg-black overflow-hidden shrink-0 flex items-center justify-center">
    <!-- 비디오 스트림 -->
    <video id="video" autoplay playsinline muted class="w-full h-full object-cover transition-transform duration-200 origin-center"></video>

    <!-- 카메라 권한/오류 안내 오버레이 -->
    <div id="cameraFallback" class="hidden absolute inset-0 bg-neutral-900/95 text-white p-4 flex flex-col items-center justify-center text-center z-20">
      <p class="text-sm font-bold text-[#FFEB00] mb-1">카메라를 사용할 수 없습니다</p>
      <p class="text-xs text-neutral-300 mb-3">브라우저 카메라 권한을 허용하거나 우측 하단의 [고화질 사진스캔] 또는 스마트폰 키보드 스캔을 이용해 주세요.</p>
      <button id="retryCamBtn" type="button" class="px-4 py-2 rounded-lg bg-[#FFEB00] text-[#2C2C2C] text-xs font-bold">
        🔄 카메라 다시 연결
      </button>
    </div>

    <!-- 타겟 스캔 박스 오버레이 (터치하면 즉시 수동 스캔) -->
    <div id="tapScanArea" class="absolute inset-0 flex flex-col items-center justify-center cursor-pointer z-10" title="화면을 터치하면 즉시 스캔합니다">
      <div id="scanBox" class="scan-box relative w-[80%] max-w-[420px] h-[72px] rounded-xl">
        <div class="corner corner-tl"></div>
        <div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div>
        <div class="corner corner-br"></div>
        <div class="laser-line"></div>
      </div>
      <div class="mt-2 px-3 py-0.5 rounded-full bg-black/65 text-white text-[11px] flex items-center gap-1.5 backdrop-blur-xs">
        <span id="statusDot" class="w-2 h-2 rounded-full bg-[#00C73C] animate-pulse"></span>
        <span id="scanGuideText">박스 안에 맞추면 자동 인식 (화면 터치 시 즉시 스캔)</span>
      </div>
    </div>

    <!-- 좌측 상단: 전처리(OCR 엔진 시야) 실시간 미니 프리뷰 -->
    <div class="absolute top-2 left-2 z-20 bg-black/75 border border-white/20 rounded-lg p-1 flex flex-col items-center backdrop-blur-xs">
      <div class="flex items-center gap-1 mb-0.5">
        <span class="text-[9px] text-neutral-300">OCR 시야</span>
        <button id="filterToggleBtn" type="button" class="text-[9px] px-1.5 py-0.2 bg-[#FFEB00] text-[#2C2C2C] rounded font-bold">
          고대비 ON
        </button>
      </div>
      <canvas id="previewCanvas" class="w-24 h-8 bg-neutral-800 rounded object-contain border border-white/10"></canvas>
    </div>

    <!-- 우측 상단: 줌 & 플래시(토치) 컨트롤 -->
    <div class="absolute top-2 right-2 z-20 flex items-center gap-1.5">
      <button id="zoomBtn" type="button" class="px-2.5 py-1.5 rounded-lg bg-black/70 text-white border border-white/20 text-xs font-bold active:scale-95 backdrop-blur-xs">
        🔍 1x
      </button>
      <button id="torchBtn" type="button" class="px-2.5 py-1.5 rounded-lg bg-black/70 text-white border border-white/20 text-xs font-bold active:scale-95 backdrop-blur-xs">
        🔦 조명
      </button>
    </div>
  </section>

  <!-- 2. 카메라 제어 바 (자동스캔 토글 / 즉시 스캔 / 고화질 사진 촬영) -->
  <section class="bg-white border-b border-neutral-200 px-3 py-2 flex items-center justify-between gap-2 shrink-0">
    <!-- 자동 스캔 ON/OFF -->
    <button id="autoScanBtn" type="button" class="flex-1 py-2 px-2.5 rounded-lg bg-[#2C2C2C] text-white text-xs font-bold flex items-center justify-center gap-1.5 active:scale-98 transition-all">
      <span id="autoScanIcon">⏸</span>
      <span id="autoScanText">자동스캔 켜짐</span>
    </button>

    <!-- 수동 즉시 스캔 버튼 -->
    <button id="manualScanBtn" type="button" class="flex-1 py-2 px-2.5 rounded-lg bg-[#FFEB00] text-[#2C2C2C] text-xs font-bold flex items-center justify-center gap-1.5 shadow-xs active:scale-98 transition-all">
      <span>📸</span>
      <span>즉시 스캔</span>
    </button>

    <!-- 고화질 기본 카메라/갤러리 이미지 파일 스캔 -->
    <input id="fileInput" type="file" accept="image/*" capture="environment" class="hidden">
    <button id="highResBtn" type="button" class="py-2 px-2.5 rounded-lg bg-neutral-100 hover:bg-neutral-200 text-neutral-800 border border-neutral-300 text-xs font-bold flex items-center justify-center gap-1 active:scale-98 transition-all" title="초점이 안 맞을 때 스마트폰 기본 카메라로 선명하게 촬영">
      <span>🖼️</span>
      <span>고화질 사진</span>
    </button>
  </section>

  <!-- 3. 메인 결과 관리 영역 (칩 리스트 + 실시간 연동 텍스트창 + 구분자 옵션) -->
  <main class="flex-1 flex flex-col p-3 gap-2.5 overflow-hidden">
    
    <!-- 상단 상태 표시줄: 개수, 중복 제거, 구분자 선택 -->
    <div class="flex flex-wrap items-center justify-between gap-1.5 shrink-0">
      <div class="flex items-center gap-1.5">
        <span class="text-xs font-bold text-neutral-700">인식된 항목</span>
        <span id="itemCountBadge" class="px-2 py-0.5 rounded-full bg-[#2C2C2C] text-[#FFEB00] text-xs font-bold">0개</span>
        <button id="dedupBtn" type="button" class="text-[11px] px-2 py-0.5 rounded bg-neutral-200 hover:bg-neutral-300 text-neutral-700 font-bold transition-colors" title="중복된 값을 하나로 합칩니다">
          중복제거
        </button>
      </div>

      <!-- 구분자 선택 옵션 -->
      <div class="flex items-center gap-1 text-xs">
        <span class="text-[11px] text-neutral-500">구분:</span>
        <select id="sepSelect" class="bg-white border border-neutral-300 rounded-md px-1.5 py-0.5 text-xs font-bold text-[#2C2C2C] focus:outline-none focus:border-[#2C2C2C]">
          <option value=", " selected>콤마+공백 (, )</option>
          <option value=",">콤마만 (,)</option>
          <option value="\n">줄바꿈 (Enter)</option>
          <option value=" ">공백 (Space)</option>
        </select>
      </div>
    </div>

    <!-- 인식된 항목 태그(Chip) 리스트 (개별 삭제 가능) -->
    <div id="chipContainer" class="flex items-center gap-1.5 overflow-x-auto py-1 px-1.5 bg-white border border-neutral-200 rounded-lg min-h-[38px] max-h-[44px] shrink-0">
      <span id="emptyChipHint" class="text-xs text-neutral-400">카메라로 스캔하거나 아래 창에 입력하면 개별 태그가 생성됩니다.</span>
    </div>

    <!-- 빠른 수동/키보드 스캔 입력 바 (스마트폰 자체 '텍스트 스캔' 완벽 호환) -->
    <div class="flex gap-1.5 shrink-0">
      <input id="quickInput" type="text" placeholder="➕ 직접 입력 또는 키보드 [텍스트 스캔] 터치 시 자동 추가" class="flex-1 bg-white border border-neutral-300 rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:border-[#2C2C2C]">
      <button id="quickAddBtn" type="button" class="px-3 py-1.5 rounded-lg bg-neutral-800 text-white text-xs font-bold shrink-0">
        추가
      </button>
    </div>

    <!-- 최종 출력 텍스트 영역 (콤마로 구분된 텍스트 & 직접 편집 동기화) -->
    <div class="flex-1 flex flex-col min-h-[80px] relative">
      <textarea id="resultTextarea" placeholder="인식된 숫자/문자가 이곳에 콤마(,)로 구분되어 자동으로 추가됩니다.&#10;직접 수정하거나 붙여넣어도 자동으로 정리됩니다." class="w-full h-full flex-1 bg-white border-2 border-neutral-300 focus:border-[#FFEB00] rounded-xl p-3 text-sm sm:text-base leading-relaxed resize-none focus:outline-none shadow-inner"></textarea>
    </div>

    <!-- 하단 액션 버튼 (방금 취소 / 전체 비우기 / 카카오워크용 복사) -->
    <div class="flex items-center gap-2 shrink-0 pt-0.5">
      <button id="undoBtn" type="button" class="py-3 px-3 rounded-xl bg-neutral-200 hover:bg-neutral-300 text-neutral-800 text-xs sm:text-sm font-bold flex items-center justify-center gap-1 active:scale-98 transition-all">
        <span>↩</span>
        <span>방금 취소</span>
      </button>

      <button id="clearBtn" type="button" class="py-3 px-3 rounded-xl bg-neutral-200 hover:bg-red-100 hover:text-red-700 text-neutral-700 text-xs sm:text-sm font-bold flex items-center justify-center gap-1 active:scale-98 transition-all">
        <span>🗑️</span>
        <span id="clearBtnText">비우기</span>
      </button>

      <button id="copyBtn" type="button" class="flex-1 py-3 px-4 rounded-xl bg-[#FFEB00] hover:bg-[#F5E000] text-[#2C2C2C] text-sm sm:text-base font-bold flex items-center justify-center gap-2 shadow-md active:scale-98 transition-all">
        <span id="copyBtnIcon">📋</span>
        <span id="copyBtnText">전체 복사하기 (카카오워크)</span>
      </button>
    </div>
  </main>

  <!-- 숨겨진 고해상도 이미지 처리 캔버스 -->
  <canvas id="workCanvas" class="hidden"></canvas>

  <script>
    // --- 상태 관리 변수 ---
    let items = [];               // 인식된 개별 항목 배열
    let historyStack = [];        // Undo(취소)를 위한 이전 상태 스택
    let ocrMode = 'NUMBER';       // 'NUMBER' (숫자 전용) | 'ALL' (문자+숫자)
    let isAutoScan = true;        // 실시간 자동 스캔 여부
    let isHighContrast = true;    // 이진화/고대비 전처리 필터 여부
    let isProcessing = false;     // 현재 OCR 처리 중 여부
    let worker = null;            // Tesseract 워커 인스턴스
    let workerReady = false;

    // 카메라 제어 관련 변수
    let videoTrack = null;
    let zoomIndex = 0;
    const zoomLevels = [1, 2, 3];
    let torchOn = false;

    // 중복 스캔 방지 쿨다운
    let lastAddedSignature = '';
    let lastAddedTime = 0;
    let clearConfirmTimer = null;

    // --- DOM 요소 참조 ---
    const video = document.getElementById('video');
    const scanBox = document.getElementById('scanBox');
    const tapScanArea = document.getElementById('tapScanArea');
    const statusDot = document.getElementById('statusDot');
    const scanGuideText = document.getElementById('scanGuideText');
    const engineStatus = document.getElementById('engineStatus');
    const cameraFallback = document.getElementById('cameraFallback');
    const retryCamBtn = document.getElementById('retryCamBtn');

    const previewCanvas = document.getElementById('previewCanvas');
    const previewCtx = previewCanvas.getContext('2d', { willReadFrequently: true });
    const workCanvas = document.getElementById('workCanvas');
    const workCtx = workCanvas.getContext('2d', { willReadFrequently: true });

    const modeNumBtn = document.getElementById('modeNumBtn');
    const modeAllBtn = document.getElementById('modeAllBtn');
    const filterToggleBtn = document.getElementById('filterToggleBtn');
    const zoomBtn = document.getElementById('zoomBtn');
    const torchBtn = document.getElementById('torchBtn');

    const autoScanBtn = document.getElementById('autoScanBtn');
    const autoScanIcon = document.getElementById('autoScanIcon');
    const autoScanText = document.getElementById('autoScanText');
    const manualScanBtn = document.getElementById('manualScanBtn');
    const highResBtn = document.getElementById('highResBtn');
    const fileInput = document.getElementById('fileInput');

    const itemCountBadge = document.getElementById('itemCountBadge');
    const dedupBtn = document.getElementById('dedupBtn');
    const sepSelect = document.getElementById('sepSelect');
    const chipContainer = document.getElementById('chipContainer');
    const emptyChipHint = document.getElementById('emptyChipHint');
    const quickInput = document.getElementById('quickInput');
    const quickAddBtn = document.getElementById('quickAddBtn');
    const resultTextarea = document.getElementById('resultTextarea');

    const undoBtn = document.getElementById('undoBtn');
    const clearBtn = document.getElementById('clearBtn');
    const clearBtnText = document.getElementById('clearBtnText');
    const copyBtn = document.getElementById('copyBtn');
    const copyBtnIcon = document.getElementById('copyBtnIcon');
    const copyBtnText = document.getElementById('copyBtnText');

    const toast = document.getElementById('toast');
    const toastIcon = document.getElementById('toastIcon');
    const toastMsg = document.getElementById('toastMsg');
    let toastTimeout = null;

    // --- 토스트 메시지 표시 함수 (alert 대체) ---
    function showToast(message, icon = '✨') {
      toastIcon.textContent = icon;
      toastMsg.textContent = message;
      toast.classList.remove('opacity-0', '-translate-y-2');
      toast.classList.add('opacity-100', 'translate-y-0');

      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', '-translate-y-2');
      }, 1800);
    }

    // --- 히스토리 저장 및 UI 동기화 ---
    function saveHistory() {
      historyStack.push([...items]);
      if (historyStack.length > 30) historyStack.shift();
    }

    function getSeparator() {
      const val = sepSelect.value;
      return val === '\\n' ? '\n' : val;
    }

    function syncUI(skipTextarea = false) {
      // 개수 배지 업데이트
      itemCountBadge.textContent = `${items.length}개`;

      // 텍스트 영역 업데이트
      if (!skipTextarea) {
        const sep = getSeparator();
        resultTextarea.value = items.join(sep);
        resultTextarea.scrollTop = resultTextarea.scrollHeight;
      }

      // 칩(태그) 리스트 렌더링
      chipContainer.innerHTML = '';
      if (items.length === 0) {
        chipContainer.appendChild(emptyChipHint);
      } else {
        items.forEach((item, idx) => {
          const chip = document.createElement('div');
          chip.className = 'inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-neutral-100 border border-neutral-300 text-xs font-bold text-[#2C2C2C] shrink-0';
          
          const textSpan = document.createElement('span');
          textSpan.textContent = item;

          const delBtn = document.createElement('button');
          delBtn.type = 'button';
          delBtn.className = 'ml-0.5 w-4 h-4 rounded-full hover:bg-neutral-300 inline-flex items-center justify-center text-neutral-500 hover:text-black';
          delBtn.textContent = '×';
          delBtn.title = '이 항목 삭제';
          delBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            saveHistory();
            items.splice(idx, 1);
            syncUI();
            showToast('항목이 삭제되었습니다', '🗑️');
          });

          chip.appendChild(textSpan);
          chip.appendChild(delBtn);
          chipContainer.appendChild(chip);
        });
        chipContainer.scrollLeft = chipContainer.scrollWidth;
      }
    }

    // --- 텍스트에서 숫자 또는 문자+숫자 추출 정제 ---
    function extractCleanTokens(rawText) {
      if (!rawText) return [];
      let text = rawText.trim();

      if (ocrMode === 'NUMBER') {
        // 숫자 모드일 때 흔히 오인식되는 알파벳을 숫자로 보정
        const corrected = text
          .replace(/[OoQD]/g, '0')
          .replace(/[Il|!]/g, '1')
          .replace(/[Zz]/g, '2')
          .replace(/[Ss$]/g, '5')
          .replace(/[Bb]/g, '8');

        // 연속된 숫자(또는 하이픈 연결 번호) 추출
        const matches = corrected.match(/\d+(?:-\d+)*/g);
        return matches ? matches.filter(m => m.length >= 1) : [];
      } else {
        // 문자+숫자 모드: 특수기호 노이즈 제거 후 의미 있는 단어/숫자 추출
        const cleaned = text.replace(/[^가-힣a-zA-Z0-9\-\s,]/g, ' ').trim();
        if (!cleaned) return [];
        return cleaned
          .split(/[\s,]+/)
          .map(s => s.trim())
          .filter(s => s.length >= 1);
      }
    }

    // --- 항목 추가 함수 ---
    function appendTokens(tokens, isManual = false) {
      if (!tokens || tokens.length === 0) {
        if (isManual) showToast('인식된 글자/숫자가 없습니다. 초점을 맞춰주세요.', '⚠️');
        return false;
      }

      const signature = tokens.join(',');
      const now = Date.now();

      // 자동 스캔 중일 때는 3.5초 이내 동일 항목 연속 중복 추가 방지
      if (!isManual && signature === lastAddedSignature && (now - lastAddedTime) < 3500) {
        return false;
      }

      lastAddedSignature = signature;
      lastAddedTime = now;

      saveHistory();
      items.push(...tokens);
      syncUI();

      // 시각적 피드백 (초록색 테두리 + 진동 + 토스트)
      scanBox.classList.add('detected');
      setTimeout(() => scanBox.classList.remove('detected'), 380);
      if (navigator.vibrate) navigator.vibrate(50);

      showToast(`+ 추가됨: ${tokens.join(', ')}`, '✅');
      return true;
    }

    // --- 1. 카메라 초기화 ---
    async function initCamera() {
      cameraFallback.classList.add('hidden');
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        });
        video.srcObject = stream;
        videoTrack = stream.getVideoTracks()[0];
      } catch (err) {
        console.warn('카메라 접근 실패:', err);
        cameraFallback.classList.remove('hidden');
        engineStatus.textContent = '카메라 오프라인 (사진/키보드 스캔 가능)';
      }
    }

    // --- 2. Tesseract.js v5 엔진 초기화 ---
    async function initOCRWorker() {
      try {
        engineStatus.textContent = 'OCR 엔진 로딩 중...';
        // 숫자/영문 + 한글 지원 워커 생성
        worker = await Tesseract.createWorker(['eng', 'kor']);
        await applyOCRParameters();
        workerReady = true;
        engineStatus.textContent = '실시간 스캔 준비 완료';
      } catch (err) {
        console.error('OCR 워커 초기화 오류:', err);
        engineStatus.textContent = 'OCR 엔진 로드 실패 (네트워크 확인)';
      }
    }

    async function applyOCRParameters() {
      if (!worker) return;
      if (ocrMode === 'NUMBER') {
        await worker.setParameters({
          tessedit_char_whitelist: '0123456789- ',
          tessedit_pageseg_mode: '6' // 단일 균일 텍스트 블록 가정
        });
      } else {
        await worker.setParameters({
          tessedit_char_whitelist: '',
          tessedit_pageseg_mode: '6'
        });
      }
    }

    // --- 3. 타겟 박스(ROI) 정밀 크롭 및 고대비/이진화 전처리 ---
    function captureAndPreprocessROI() {
      if (video.readyState < 2 || !video.videoWidth) return false;

      const vw = video.videoWidth;
      const vh = video.videoHeight;

      const videoRect = video.getBoundingClientRect();
      const boxRect = scanBox.getBoundingClientRect();

      // object-fit: cover 상태에서의 실제 비디오 픽셀 매핑 계산
      const videoAspect = vw / vh;
      const containerAspect = videoRect.width / videoRect.height;

      let renderW, renderH, offsetX, offsetY;
      if (containerAspect > videoAspect) {
        renderW = videoRect.width;
        renderH = videoRect.width / videoAspect;
        offsetX = 0;
        offsetY = (renderH - videoRect.height) / 2;
      } else {
        renderH = videoRect.height;
        renderW = videoRect.height * videoAspect;
        offsetX = (renderW - videoRect.width) / 2;
        offsetY = 0;
      }

      // 줌 폴백(CSS 스케일) 적용 시 중앙 크롭 보정
      const currentZoom = zoomLevels[zoomIndex];
      const relLeft = (boxRect.left - videoRect.left + offsetX) / renderW;
      const relTop = (boxRect.top - videoRect.top + offsetY) / renderH;
      const relW = boxRect.width / renderW;
      const relH = boxRect.height / renderH;

      const cropW = Math.max(60, (vw * relW) / currentZoom);
      const cropH = Math.max(30, (vh * relH) / currentZoom);
      const cropX = Math.max(0, (vw * relLeft) + (vw * relW - cropW) / 2);
      const cropY = Math.max(0, (vh * relTop) + (vh * relH - cropH) / 2);

      // OCR 인식률을 높이기 위해 적정 크기로 업스케일 및 여백(패딩) 확보
      const scale = cropH < 90 ? 2 : 1.2;
      const pad = 16;
      workCanvas.width = Math.round(cropW * scale) + pad * 2;
      workCanvas.height = Math.round(cropH * scale) + pad * 2;

      // 흰색 배경 채우기 (Tesseract는 가장자리 여백이 있을 때 인식률이 크게 향상됨)
      workCtx.fillStyle = '#FFFFFF';
      workCtx.fillRect(0, 0, workCanvas.width, workCanvas.height);

      workCtx.drawImage(
        video,
        cropX, cropY, cropW, cropH,
        pad, pad, workCanvas.width - pad * 2, workCanvas.height - pad * 2
      );

      // 고대비 흑백(적응형 임계값) 전처리 수행
      if (isHighContrast) {
        binarizeCanvas(workCtx, workCanvas.width, workCanvas.height);
      }

      // 미니 프리뷰 캔버스에 복사
      previewCanvas.width = workCanvas.width;
      previewCanvas.height = workCanvas.height;
      previewCtx.drawImage(workCanvas, 0, 0);

      return true;
    }

    // 픽셀 기반 고대비 그레이스케일 + 적응형 대비 강화 함수
    function binarizeCanvas(ctx, width, height) {
      const imgData = ctx.getImageData(0, 0, width, height);
      const data = imgData.data;

      // 평균 밝기 계산
      let sum = 0;
      const len = data.length / 4;
      for (let i = 0; i < data.length; i += 4) {
        const lum = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
        data[i] = lum;
        sum += lum;
      }
      const avgLum = sum / len;
      const threshold = avgLum * 0.88; // 글자 획을 뚜렷하게 잡기 위한 임계값

      for (let i = 0; i < data.length; i += 4) {
        const lum = data[i];
        // 부드러운 고대비 스트레칭 (글자 깨짐 방지)
        let val = lum < threshold ? Math.max(0, (lum / threshold) * 60) : Math.min(255, 190 + ((lum - threshold) / (255 - threshold)) * 65);
        data[i] = val;
        data[i + 1] = val;
        data[i + 2] = val;
      }

      ctx.putImageData(imgData, 0, 0);
    }

    // --- 4. 스캔 실행 함수 (자동 & 수동 겸용) ---
    async function performROIScan(isManual = false) {
      if (!workerReady || isProcessing) return;
      if (!captureAndPreprocessROI()) return;

      isProcessing = true;
      if (isManual) {
        scanGuideText.textContent = '스캔 분석 중...';
      }

      try {
        const { data: { text, confidence } } = await worker.recognize(workCanvas);
        const minConfidence = isManual ? 35 : 55;

        if (confidence >= minConfidence && text) {
          const tokens = extractCleanTokens(text);
          appendTokens(tokens, isManual);
        } else if (isManual) {
          showToast('글자가 선명하지 않습니다. 2x 줌이나 고화질 사진을 써보세요.', '🔍');
        }
      } catch (err) {
        console.error('OCR 인식 오류:', err);
      } finally {
        isProcessing = false;
        if (isManual) {
          scanGuideText.textContent = isAutoScan
            ? '박스 안에 맞추면 자동 인식 (화면 터치 시 즉시 스캔)'
            : '자동 스캔 일시정지됨 (화면 터치 시 즉시 스캔)';
        }
      }
    }

    // 실시간 자동 스캔 루프 (1.1초 간격)
    setInterval(() => {
      if (isAutoScan && !isProcessing && workerReady && video.readyState === 4) {
        performROIScan(false);
      } else if (video.readyState === 4 && !isProcessing) {
        // 일시정지 중에도 미니 프리뷰는 계속 갱신
        captureAndPreprocessROI();
      }
    }, 1100);

    // --- 5. 고화질 사진/갤러리 이미지 전체 OCR ---
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = async () => {
        showToast('고화질 이미지 분석 중...', '⏳');
        const maxDim = 1600;
        let w = img.width;
        let h = img.height;
        if (w > maxDim) {
          h = Math.round(h * (maxDim / w));
          w = maxDim;
        }
        workCanvas.width = w;
        workCanvas.height = h;
        workCtx.drawImage(img, 0, 0, w, h);

        if (isHighContrast) {
          binarizeCanvas(workCtx, w, h);
        }

        previewCanvas.width = w;
        previewCanvas.height = h;
        previewCtx.drawImage(workCanvas, 0, 0);

        URL.revokeObjectURL(url);

        if (workerReady) {
          isProcessing = true;
          try {
            const { data: { text } } = await worker.recognize(workCanvas);
            const tokens = extractCleanTokens(text);
            appendTokens(tokens, true);
          } catch (err) {
            showToast('이미지 인식 중 오류가 발생했습니다.', '⚠️');
          } finally {
            isProcessing = false;
          }
        }
      };
      img.src = url;
      e.target.value = '';
    });

    // --- 6. 각종 버튼 이벤트 바인딩 ---
    // 모드 전환: 숫자 전용 vs 문자+숫자
    modeNumBtn.addEventListener('click', async () => {
      if (ocrMode === 'NUMBER') return;
      ocrMode = 'NUMBER';
      modeNumBtn.className = 'px-2.5 py-1 rounded-full text-xs font-bold bg-[#2C2C2C] text-[#FFEB00] transition-all';
      modeAllBtn.className = 'px-2.5 py-1 rounded-full text-xs font-bold text-[#2C2C2C] hover:bg-black/5 transition-all';
      await applyOCRParameters();
      showToast('숫자 전용 모드로 전환되었습니다', '🔢');
    });

    modeAllBtn.addEventListener('click', async () => {
      if (ocrMode === 'ALL') return;
      ocrMode = 'ALL';
      modeAllBtn.className = 'px-2.5 py-1 rounded-full text-xs font-bold bg-[#2C2C2C] text-[#FFEB00] transition-all';
      modeNumBtn.className = 'px-2.5 py-1 rounded-full text-xs font-bold text-[#2C2C2C] hover:bg-black/5 transition-all';
      await applyOCRParameters();
      showToast('문자+숫자 모드로 전환되었습니다', '🔤');
    });

    // 고대비 전처리 필터 토글
    filterToggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      isHighContrast = !isHighContrast;
      filterToggleBtn.textContent = isHighContrast ? '고대비 ON' : '원본 컬러';
      filterToggleBtn.className = isHighContrast
        ? 'text-[9px] px-1.5 py-0.2 bg-[#FFEB00] text-[#2C2C2C] rounded font-bold'
        : 'text-[9px] px-1.5 py-0.2 bg-neutral-600 text-white rounded font-bold';
      captureAndPreprocessROI();
    });

    // 줌 (1x -> 2x -> 3x) 토글
    zoomBtn.addEventListener('click', async (e) => {
      e.stopPropagation();
      zoomIndex = (zoomIndex + 1) % zoomLevels.length;
      const targetZoom = zoomLevels[zoomIndex];
      zoomBtn.textContent = `🔍 ${targetZoom}x`;

      let hardwareZoomApplied = false;
      if (videoTrack && videoTrack.getCapabilities) {
        const caps = videoTrack.getCapabilities();
        if (caps.zoom) {
          const clamped = Math.min(targetZoom, caps.zoom.max || targetZoom);
          try {
            await videoTrack.applyConstraints({ advanced: [{ zoom: clamped }] });
            hardwareZoomApplied = true;
          } catch (err) {
            hardwareZoomApplied = false;
          }
        }
      }
      // 하드웨어 줌 미지원 기기에서는 CSS 스케일로 확대
      video.style.transform = hardwareZoomApplied ? 'scale(1)' : `scale(${targetZoom})`;
      showToast(`${targetZoom}배 줌 적용`, '🔍');
    });

    // 플래시(토치) 토글
    torchBtn.addEventListener('click', async (e) => {
      e.stopPropagation();
      if (!videoTrack || !videoTrack.getCapabilities) {
        showToast('이 기기에서는 조명을 제어할 수 없습니다', '💡');
        return;
      }
      const caps = videoTrack.getCapabilities();
      if (!caps.torch) {
        showToast('브라우저가 카메라 플래시를 지원하지 않습니다', '💡');
        return;
      }
      try {
        torchOn = !torchOn;
        await videoTrack.applyConstraints({ advanced: [{ torch: torchOn }] });
        torchBtn.className = torchOn
          ? 'px-2.5 py-1.5 rounded-lg bg-[#FFEB00] text-[#2C2C2C] border border-[#FFEB00] text-xs font-bold active:scale-95'
          : 'px-2.5 py-1.5 rounded-lg bg-black/70 text-white border border-white/20 text-xs font-bold active:scale-95';
      } catch (err) {
        showToast('조명 전환에 실패했습니다', '⚠️');
      }
    });

    // 자동 스캔 일시정지 / 재개
    autoScanBtn.addEventListener('click', () => {
      isAutoScan = !isAutoScan;
      if (isAutoScan) {
        autoScanIcon.textContent = '⏸';
        autoScanText.textContent = '자동스캔 켜짐';
        autoScanBtn.className = 'flex-1 py-2 px-2.5 rounded-lg bg-[#2C2C2C] text-white text-xs font-bold flex items-center justify-center gap-1.5 active:scale-98 transition-all';
        statusDot.className = 'w-2 h-2 rounded-full bg-[#00C73C] animate-pulse';
        scanBox.classList.remove('paused');
        scanGuideText.textContent = '박스 안에 맞추면 자동 인식 (화면 터치 시 즉시 스캔)';
        showToast('실시간 자동 스캔이 시작되었습니다', '▶️');
      } else {
        autoScanIcon.textContent = '▶️';
        autoScanText.textContent = '자동스캔 정지됨';
        autoScanBtn.className = 'flex-1 py-2 px-2.5 rounded-lg bg-neutral-200 text-neutral-700 text-xs font-bold flex items-center justify-center gap-1.5 active:scale-98 transition-all';
        statusDot.className = 'w-2 h-2 rounded-full bg-neutral-400';
        scanBox.classList.add('paused');
        scanGuideText.textContent = '자동 스캔 일시정지됨 (화면 터치 시 즉시 스캔)';
        showToast('자동 스캔이 일시정지되었습니다', '⏸');
      }
    });

    // 수동 즉시 스캔 (버튼 또는 카메라 화면 터치)
    manualScanBtn.addEventListener('click', () => performROIScan(true));
    tapScanArea.addEventListener('click', () => performROIScan(true));
    highResBtn.addEventListener('click', () => fileInput.click());
    retryCamBtn.addEventListener('click', initCamera);

    // 빠른 입력 바 (키보드 텍스트 스캔 & 직접 추가)
    function handleQuickInput() {
      const val = quickInput.value.trim();
      if (!val) return;
      const tokens = extractCleanTokens(val);
      if (tokens.length > 0) {
        appendTokens(tokens, true);
      } else {
        // 숫자 모드여도 사용자가 직접 입력한 텍스트는 그대로 추가 허용
        saveHistory();
        items.push(val);
        syncUI();
        showToast(`+ 추가됨: ${val}`, '✅');
      }
      quickInput.value = '';
    }

    quickAddBtn.addEventListener('click', handleQuickInput);
    quickInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        handleQuickInput();
      }
    });
    // 스마트폰 기본 키보드 '텍스트 스캔'으로 한 번에 들어올 때 자동 처리
    quickInput.addEventListener('paste', () => {
      setTimeout(handleQuickInput, 60);
    });

    // 결과 텍스트창 직접 편집 시 배열과 동기화
    resultTextarea.addEventListener('input', () => {
      const raw = resultTextarea.value;
      if (!raw.trim()) {
        items = [];
      } else {
        items = raw
          .split(/[\n,]+/)
          .map(s => s.trim())
          .filter(Boolean);
      }
      syncUI(true);
    });

    // 구분자 변경 시 즉시 재포맷
    sepSelect.addEventListener('change', () => {
      syncUI();
      showToast('구분자가 변경되었습니다', '🔧');
    });

    // 중복 제거 버튼
    dedupBtn.addEventListener('click', () => {
      if (items.length <= 1) return;
      const unique = [...new Set(items)];
      const removedCount = items.length - unique.length;
      if (removedCount > 0) {
        saveHistory();
        items = unique;
        syncUI();
        showToast(`중복 항목 ${removedCount}개가 제거되었습니다`, '✨');
      } else {
        showToast('중복된 항목이 없습니다', '👌');
      }
    });

    // 방금 취소 (Undo)
    undoBtn.addEventListener('click', () => {
      if (historyStack.length === 0) {
        if (items.length > 0) {
          items.pop();
          syncUI();
          showToast('마지막 항목을 취소했습니다', '↩');
        } else {
          showToast('취소할 내역이 없습니다', 'ℹ️');
        }
        return;
      }
      items = historyStack.pop();
      lastAddedSignature = '';
      syncUI();
      showToast('이전 상태로 되돌렸습니다', '↩');
    });

    // 전체 비우기 (2번 탭 안전 확인 또는 Undo 가능)
    clearBtn.addEventListener('click', () => {
      if (items.length === 0 && !resultTextarea.value.trim()) {
        showToast('이미 비어 있습니다', 'ℹ️');
        return;
      }
      if (!clearConfirmTimer) {
        clearBtnText.textContent = '한번 더 누르면 삭제';
        clearBtn.classList.add('bg-red-600', 'text-white');
        clearConfirmTimer = setTimeout(() => {
          clearConfirmTimer = null;
          clearBtnText.textContent = '비우기';
          clearBtn.classList.remove('bg-red-600', 'text-white');
        }, 2500);
        return;
      }

      clearTimeout(clearConfirmTimer);
      clearConfirmTimer = null;
      clearBtnText.textContent = '비우기';
      clearBtn.classList.remove('bg-red-600', 'text-white');

      saveHistory();
      items = [];
      lastAddedSignature = '';
      syncUI();
      showToast('전체 목록을 비웠습니다 ([방금 취소]로 복구 가능)', '🗑️');
    });

    // 카카오워크용 클립보드 복사
    copyBtn.addEventListener('click', async () => {
      const textToCopy = resultTextarea.value.trim();
      if (!textToCopy) {
        showToast('복사할 내용이 없습니다. 먼저 숫자를 스캔해 주세요!', '⚠️');
        return;
      }

      try {
        await navigator.clipboard.writeText(textToCopy);
      } catch (err) {
        resultTextarea.select();
        document.execCommand('copy');
        window.getSelection().removeAllRanges();
      }

      if (navigator.vibrate) navigator.vibrate([40, 60, 40]);
      copyBtnIcon.textContent = '✅';
      copyBtnText.textContent = '복사 완료! 카카오워크에 붙여넣기 하세요';
      showToast('클립보드에 복사되었습니다!', '📋');

      setTimeout(() => {
        copyBtnIcon.textContent = '📋';
